    <main>
        <form action="">
            <label for="etkinlikad">Etkinlik Adı</label> <br>
            <input type="text" required> <br>
            <label for="kategori">Kategori</label> <br>
            <select name="kategoriler" id="kategoriler">

                <option value="atolye">Atölye</option>
            </select> <br>
            <label for="tarih">Tarih / Saat</label> <br>
            <input type="datetime-local" required> <br>
            <label for="aciklama">Açıklama</label> <br>
            <textarea name="aciklama" id="aciklama" required></textarea> <br>
            <input type="submit" value="Kaydet"> <br>
        </form>
